[build-system]
requires = ["setuptools>=69", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "simmotipo"
dynamic = ["version"]                 # taken from the git tag
requires-python = ">=3.12"
dependencies = ["requests", "python-dateutil"]

[project.optional-dependencies]
mcp = ["fastmcp"]                     # only needed by spmcp.py

[tool.setuptools]
py-modules = ["supportpal", "spmcp"]  # import names stay exactly the same

[tool.setuptools_scm]
